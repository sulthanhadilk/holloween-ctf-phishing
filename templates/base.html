<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}NIGHTMARE CTF — Register Now{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<body>

  <!-- Floating bats -->

    <span class="bat">🦇</span>
    <span class="bat">🦇</span>
    <span class="bat">🦇</span>

  {% block body %}{% endblock %}

  <footer>
    <p>🕸️ &copy; 2026 NIGHTMARE CTF &nbsp;|&nbsp; All contestant data is handled securely &nbsp;|&nbsp; 🕸️</p>

</html>
